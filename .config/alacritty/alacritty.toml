[colors.primary]
background = '#1e1e2e'
foreground = '#cdd6f4'
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = '#1e1e2e'
cursor = '#f5e0dc'

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.bright]
black = "#585b70"
red = "#f37799"
green = "#89d88b"
yellow = "#ebd391"
blue = "#74a8fc"
magenta = "#f2aede"
cyan = "#6bd7ca"
white = "#bac2de"

[window]
title = "Alacritty"
opacity = 0.9
padding.x = 2
padding.y = 2
dynamic_padding = true

[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"
